# Sitio estático sin build: Netlify publica la raíz tal cual.

[build]
  publish = "."
  command = ""

# Las fotos llevan el ancho en el nombre (picada-624.avif), así que su contenido
# nunca cambia: se pueden cachear para siempre.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El CSS y el JS sí se editan, así que se revalidan en cada visita.
# (Rutas separadas a propósito: si usara /assets/* pisaría la regla de arriba.)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
